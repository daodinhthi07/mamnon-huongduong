<html lang="vi">
<head>

<title>Bảng kê Thực đơn - Chi tiền chợ | MN Bạch Dương</title>
<style>
:root{
  --bg:#f5f3ee; --card:#ffffff; --ink:#2c2620; --ink-soft:#726a5e;

  --gold:#b8952f; --gold-soft:#f4ecd6;
  --shadow: 0 1px 2px rgba(40,30,10,0.06), 0 4px 16px rgba(40,30,10,0.06);
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171410; --card:#211d17; --ink:#f1ece1; --ink-soft:#b8ae9c;
    --line:#352f26; --accent:#e8935a; --accent-soft:#3a2717; --accent-ink:#f3b788;
    --green:#8fc79c; --green-soft:#20301f;
    --blue:#9dc0e6; --blue-soft:#1b2836;
    --gold:#e3c876; --gold-soft:#332c15;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"]{
  --bg:#171410; --card:#211d17; --ink:#f1ece1; --ink-soft:#b8ae9c;
  --line:#352f26; --accent:#e8935a; --accent-soft:#3a2717; --accent-ink:#f3b788;
  --green:#8fc79c; --green-soft:#20301f;
  --blue:#9dc0e6; --blue-soft:#1b2836;
  --gold:#e3c876; --gold-soft:#332c15;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.35);
}
html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, -apple-system, sans-serif;
  min-height:100%;
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
}
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Fraunces:wght@500;600&display=swap');
.wrap{ max-width: 980px; margin:0 auto; padding: 18px 16px 40px; }

.topbar{
  position:sticky; top:0; z-index:20;
  padding-top: env(safe-area-inset-top, 0px);
  background: linear-gradient(180deg, var(--bg) 60%, transparent);
  backdrop-filter: blur(6px);
}
.hero{ padding: 14px 16px 10px; max-width: 980px; margin:0 auto; }
.hero .eyebrow{ font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft); font-weight:600; }
.hero h1{ font-family:'Fraunces', serif; font-weight:600; font-size: clamp(20px, 4.4vw, 28px); margin: 3px 0 2px; color:var(--ink); line-height:1.2; }
.hero .sub{ font-size:13px; color:var(--ink-soft); }

.selrow{ display:flex; gap:8px; overflow-x:auto; padding: 10px 16px 4px; max-width:980px; margin:0 auto; scrollbar-width:none;}
.selrow::-webkit-scrollbar{display:none;}
.pill{ flex: 0 0 auto; padding:8px 15px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink-soft); font-weight:600; font-size:13.5px; cursor:pointer; transition: all .15s ease; white-space:nowrap; }
.pill:hover{ border-color: var(--accent); }
.pill.active{ background: var(--accent); color:#fff8f0; border-color:var(--accent); box-shadow: 0 2px 10px rgba(181,101,47,0.35); }

.daytabs{ display:flex; gap:6px; overflow-x:auto; padding: 4px 16px 12px; max-width:980px; margin:0 auto; scrollbar-width:none;}
.daytabs::-webkit-scrollbar{display:none;}
.daytab{ flex:0 0 auto; padding:9px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); cursor:pointer; text-align:center; min-width:78px; }
.daytab .d1{ font-size:12.5px; font-weight:700; color:var(--ink); }
.daytab .d2{ font-size:10.5px; color:var(--ink-soft); margin-top:1px; }
.daytab.active{ background:var(--accent-soft); border-color:var(--accent); }
.daytab.active .d1{ color:var(--accent-ink); }

.card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow: var(--shadow); }
.card h2{ font-size:14.5px; margin:0 0 12px; display:flex; align-items:center; gap:8px; color:var(--ink); font-weight:700; }
.card h2 .badge{ width:22px; height:22px; border-radius:7px; background:var(--accent-soft); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; flex:0 0 auto; }
.dateline{ font-size:13px; color:var(--accent-ink); font-weight:700; margin-bottom:2px;}

.menugrid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(210px,1fr)); gap:8px; }
.menuitem{ background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:9px 12px; }
.menuitem .lbl{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:700; }
.menuitem .dish{ font-size:13.5px; margin-top:2px; color:var(--ink); font-weight:600; line-height:1.3;}

table{ width:100%; border-collapse:collapse; font-size:12.6px; min-width:480px; }
th, td{ padding:7px 8px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
th:first-child, td:first-child{ text-align:left; white-space:normal; }
td:nth-child(2), th:nth-child(2){ text-align:left; white-space:normal; }
thead th{ background:var(--bg); color:var(--ink-soft); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.03em; position:sticky; top:0; }
tbody tr:hover{ background: var(--accent-soft); }
tr.total td{ font-weight:800; background:var(--gold-soft); color:var(--ink); border-top:2px solid var(--gold); }
.stt-col{ width:28px; text-align:center !important; color:var(--ink-soft); }
.small-note{ font-size:11px; color:var(--ink-soft); font-style:italic; }
.tablewrap{ overflow-x:auto; border-radius:10px; border:1px solid var(--line); }

.chipgrid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap:8px; margin-top:4px;}
.chip{ background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
.chip .k{ font-size:10.5px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
.chip .v{ font-size:15px; font-weight:800; margin-top:3px; color:var(--ink); }
.chip.blue{ background:var(--blue-soft);} .chip.blue .v{ color:var(--blue);}
.chip.green{ background:var(--green-soft);} .chip.green .v{ color:var(--green);}
.chip.gold{ background:var(--gold-soft);} .chip.gold .v{ color:#8a6d16;}
@media (prefers-color-scheme:dark){ .chip.gold .v { color:var(--gold);} }
:root[data-theme="dark"] .chip.gold .v{ color:var(--gold);}

.editbox{ background:var(--blue-soft); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:14px; }
.editbox .lead{ font-size:12.5px; font-weight:700; color:var(--blue); margin-bottom:9px; display:flex; align-items:center; gap:6px;}
.editgrid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap:10px; align-items:end;}
.efield label{ display:block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); margin-bottom:4px;}
.efield input{
  width:100%; padding:9px 10px; border-radius:10px; border:1px solid var(--line);
  background:var(--card); color:var(--ink); font-size:15px; font-weight:700;
  font-family:inherit;
}
.efield input:focus{ outline:2px solid var(--blue); outline-offset:1px; }
.editactions{ display:flex; gap:8px; margin-top:10px; }
.btn{ padding:8px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); font-weight:700; font-size:12.5px; cursor:pointer; color:var(--ink); }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff8f0; }
.btn:hover{ filter:brightness(0.97); }
.changed-tag{ display:inline-block; background:var(--accent); color:#fff8f0; font-size:10px; font-weight:800; padding:2px 7px; border-radius:6px; margin-left:6px; vertical-align:middle; }
.note{ font-size:11.3px; color:var(--ink-soft); margin-top:8px; line-height:1.5; }

.signrow{ display:grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap:10px; text-align:center; margin-top:6px;}
.signrow .role{ font-size:11.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase;}
.signrow .name{ font-size:13px; margin-top:26px; font-weight:600; color:var(--ink); border-top:1px dashed var(--line); padding-top:4px;}

.footer-note{ text-align:center; color:var(--ink-soft); font-size:11.5px; margin-top:18px; padding:0 20px;}

@media (max-width: 480px){ table{ font-size:11.6px; } th, td{ padding:6px 5px; } }
</style>
</head>

const CHO_LABELS = {TC:'Chợ TC', PH:'Chợ PH', DT:'Chợ ĐT'};
const TUAN_LABELS = Object.keys(DATA);

let state = { tuan: TUAN_LABELS[0], cho: 'TC', dayIdx: 0, portions: null };

function fmt(n){
  if(n===null || n===undefined || n==='') return '—';
  if(typeof n === 'string') return n;
  const r = Math.round(n*100)/100;
  return r.toLocaleString('vi-VN');
}
function money(n){
  if(n===null || n===undefined || isNaN(n)) return '—';
  return Math.round(n).toLocaleString('vi-VN') + ' đ';
}

function getBaselinePortions(day){
  const xuatAn = day.financial_summary.find(f=>f.label.includes('Xuất ăn'));
  return {
    an_sang: (xuatAn && xuatAn.an_sang) || 0,
    nha_tre: (xuatAn && xuatAn.nha_tre) || 0,
    mau_giao: (xuatAn && xuatAn.mau_giao) || 0,
  };
}
function getRate(day){
  const r = day.financial_summary.find(f=>f.label.includes('Số tiền ăn'));
  return { an_sang: (r&&r.an_sang)||0, nha_tre:(r&&r.nha_tre)||0, mau_giao:(r&&r.mau_giao)||0 };
}

// Recompute an entire day's numbers given new portion counts, scaling proportionally
// from the workbook's own baseline ratios for THIS specific day + market (so it always
// stays tied to the menu/recipe actually shown for that day).
function computeScaled(day, portions){
  const base = getBaselinePortions(day);
  const rate = getRate(day);
  const ratio = {
    an_sang: base.an_sang>0 ? (portions.an_sang/base.an_sang) : 0,
    nha_tre: base.nha_tre>0 ? (portions.nha_tre/base.nha_tre) : 0,
    mau_giao: base.mau_giao>0 ? (portions.mau_giao/base.mau_giao) : 0,
  };

  const giavi = day.giavi.map(r=>{
    const sl_an_sang = (r.sl_an_sang||0)*ratio.an_sang;
    const sl_nha_tre = (r.sl_nha_tre||0)*ratio.nha_tre;
    const sl_mau_giao = (r.sl_mau_giao||0)*ratio.mau_giao;
    return {...r,
      sl_an_sang, sl_nha_tre, sl_mau_giao,
      tt_an_sang: sl_an_sang*(r.don_gia||0),
      tt_nha_tre: sl_nha_tre*(r.don_gia||0),
      tt_mau_giao: sl_mau_giao*(r.don_gia||0),
    };
  });
  const giavi_total = giavi.reduce((a,r)=>({
    tt_an_sang:a.tt_an_sang+r.tt_an_sang, tt_nha_tre:a.tt_nha_tre+r.tt_nha_tre, tt_mau_giao:a.tt_mau_giao+r.tt_mau_giao
  }), {tt_an_sang:0,tt_nha_tre:0,tt_mau_giao:0});

  const sang = day.sang.map(r=>{
    const so_luong = (r.so_luong||0)*ratio.an_sang;
    return {...r, so_luong, thanh_tien: so_luong*(r.don_gia||0)};
  });
  const sang_total = sang.reduce((a,r)=>a+r.thanh_tien,0);

  const chinh = day.chinh_xe.map(r=>{
    const sl_nha_tre = (r.sl_nha_tre||0)*ratio.nha_tre;
    const sl_mau_giao = (r.sl_mau_giao||0)*ratio.mau_giao;
    const tt_nha_tre = sl_nha_tre*(r.don_gia||0);
    const tt_mau_giao = sl_mau_giao*(r.don_gia||0);
    return {...r, sl_nha_tre, sl_mau_giao, tt_nha_tre, tt_mau_giao, tong_sl: sl_nha_tre+sl_mau_giao, tong_tt: tt_nha_tre+tt_mau_giao};
  });
  const chinh_xe_total = chinh.reduce((a,r)=>({
    tt_nha_tre:a.tt_nha_tre+r.tt_nha_tre, tt_mau_giao:a.tt_mau_giao+r.tt_mau_giao, tong_thanh_tien:a.tong_thanh_tien+r.tong_tt
  }), {tt_nha_tre:0,tt_mau_giao:0,tong_thanh_tien:0});

  const chi_an_sang = giavi_total.tt_an_sang + sang_total;
  const chi_nha_tre = giavi_total.tt_nha_tre + chinh_xe_total.tt_nha_tre;
  const chi_mau_giao = giavi_total.tt_mau_giao + chinh_xe_total.tt_mau_giao;
  const chi_tong = chi_an_sang + chi_nha_tre + chi_mau_giao;

  const duoc_chi_an_sang = portions.an_sang*rate.an_sang;
  const duoc_chi_nha_tre = portions.nha_tre*rate.nha_tre;
  const duoc_chi_mau_giao = portions.mau_giao*rate.mau_giao;
  const duoc_chi_tong = duoc_chi_an_sang+duoc_chi_nha_tre+duoc_chi_mau_giao;

  const financial_summary = [
    {label:'Số tiền ăn trên 1 cháu', tong:null, an_sang:rate.an_sang, nha_tre:rate.nha_tre, mau_giao:rate.mau_giao},
    {label:'Xuất ăn trong ngày', tong:null, an_sang:portions.an_sang, nha_tre:portions.nha_tre, mau_giao:portions.mau_giao},
    {label:'Số tiền được phép chi chợ', tong:duoc_chi_tong, an_sang:duoc_chi_an_sang, nha_tre:duoc_chi_nha_tre, mau_giao:duoc_chi_mau_giao},
    {label:'Tổng chi tiền chợ trong ngày', tong:chi_tong, an_sang:chi_an_sang, nha_tre:chi_nha_tre, mau_giao:chi_mau_giao},
    {label:'Chênh lệch cuối ngày', tong:duoc_chi_tong-chi_tong, an_sang:duoc_chi_an_sang-chi_an_sang, nha_tre:duoc_chi_nha_tre-chi_nha_tre, mau_giao:duoc_chi_mau_giao-chi_mau_giao},
  ];

  return { ...day, giavi, giavi_total, sang, sang_total, chinh_xe: chinh, chinh_xe_total, financial_summary };
}

function renderTuanRow(){
  const el = document.getElementById('tuanRow');
  el.innerHTML = '';
  TUAN_LABELS.forEach(tuan=>{
    const b = document.createElement('button');
    b.className = 'pill' + (state.tuan===tuan ? ' active':'');
    b.innerHTML = tuan;
    b.onclick = ()=>{ state.tuan = tuan; state.dayIdx = 0; state.portions = null; renderAll(); };
    el.appendChild(b);
  });
}

function renderChoRow(){
  const el = document.getElementById('choRow');
  el.innerHTML = '';
  Object.keys(CHO_LABELS).forEach(code=>{
    const b = document.createElement('button');
    b.className = 'pill' + (state.cho===code ? ' active':'');
    b.innerHTML = CHO_LABELS[code];
    b.onclick = ()=>{ state.cho = code; if(state.dayIdx >= DATA[state.tuan][code].length) state.dayIdx = 0; state.portions = null; renderAll(); };
    el.appendChild(b);
  });
}

function shortDay(label){
  const parts = label.split(',');
  const d1 = parts[0].trim();
  const m = label.match(/ngày\s*([0-9]+)\s*tháng\s*([0-9]+)/);
  const d2 = m ? (m[1]+'/'+m[2]) : '';
  return {d1, d2};
}

function renderDayRow(){
  const el = document.getElementById('dayRow');
  el.innerHTML = '';
  const days = DATA[state.tuan][state.cho];
  days.forEach((day, idx)=>{
    const {d1,d2} = shortDay(day.day_label);
    const b = document.createElement('div');
    b.className = 'daytab' + (state.dayIdx===idx ? ' active':'');
    b.innerHTML = `<div class="d1">${d1}</div><div class="d2">${d2}</div>`;
    b.onclick = ()=>{ state.dayIdx = idx; state.portions = null; renderContent(); highlightDay(); };
    el.appendChild(b);
  });
}
function highlightDay(){
  document.querySelectorAll('.daytab').forEach((n,i)=> n.classList.toggle('active', i===state.dayIdx));
}

function menuIcon(label, dish, i){
  const L = (label||'').toLowerCase();
  if(L.includes('sáng')) return '☀️ Sáng';
  if(L.includes('trưa')) return '🍚 Trưa';
  if(L.includes('tráng')) return '🍉 Tráng miệng';
  if(L.includes('xế')) return '🥣 Xế chiều';
  if(L.includes('chính chiều')) return '🌙 Chính chiều';
  if(label && label.trim()) return label;
  if(i===2) return '🍖 Mặn';
  if(i===3) return '🥘 Xào';
  return '🥛 Sữa';
}

function renderMenu(menu){
  let out = menu.map((m,i)=>`<div class="menuitem"><div class="lbl">${menuIcon(m.label,m.dish,i)}</div><div class="dish">${m.dish}</div></div>`);
  return `<div class="menugrid">${out.join('')}</div>`;
}

function renderFinancial(fin){
  let rows = fin.map(f=>{
    const fmtCell = v => (v===null||v===undefined) ? '—' : (Math.abs(v)>=1000 ? money(v) : fmt(v));
    return `<tr><td>${f.label.replace(':','').trim()}</td>
      <td>${fmtCell(f.tong)}</td><td>${fmtCell(f.an_sang)}</td><td>${fmtCell(f.nha_tre)}</td><td>${fmtCell(f.mau_giao)}</td>
      </tr>`;
  }).join('');
  return `<div class="tablewrap"><table>
    <thead><tr><th>Chỉ tiêu</th><th>Tổng cộng</th><th>Ăn sáng</th><th>Nhà trẻ</th><th>Mẫu giáo</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function renderGiaVi(rows, totals){
  let body = rows.map(r=>`<tr>
    <td class="stt-col">${r.stt??''}</td><td>${r.ten}</td><td>${r.dvt}</td>
    <td>${fmt(r.sl_an_sang)}</td><td>${fmt(r.sl_nha_tre)}</td><td>${fmt(r.sl_mau_giao)}</td>
    <td>${money(r.don_gia)}</td><td>${money(r.tt_an_sang)}</td><td>${money(r.tt_nha_tre)}</td><td>${money(r.tt_mau_giao)}</td>
  </tr>`).join('');
  const tot = `<tr class="total"><td colspan="7">Tổng cộng</td>
    <td>${money(totals.tt_an_sang)}</td><td>${money(totals.tt_nha_tre)}</td><td>${money(totals.tt_mau_giao)}</td></tr>`;
  return `<div class="tablewrap"><table>
    <thead><tr><th>#</th><th>Thực phẩm</th><th>ĐVT</th><th>SL Ăn sáng</th><th>SL Nhà trẻ</th><th>SL Mẫu giáo</th><th>Đơn giá</th><th>TT Ăn sáng</th><th>TT Nhà trẻ</th><th>TT Mẫu giáo</th></tr></thead>
    <tbody>${body}${tot}</tbody></table></div>`;
}

function renderSang(rows, total){
  let body = rows.map(r=>`<tr>
    <td class="stt-col">${r.stt??''}</td><td>${r.ten}</td><td>${r.dvt}</td>
    <td>${fmt(r.so_luong)}</td><td>${money(r.don_gia)}</td><td>${money(r.thanh_tien)}</td>
    <td class="small-note">${r.ghi_chu||''}</td>
  </tr>`).join('');
  const tot = `<tr class="total"><td colspan="5">Tổng cộng</td><td>${money(total)}</td><td></td></tr>`;
  return `<div class="tablewrap"><table>
    <thead><tr><th>#</th><th>Thực phẩm</th><th>ĐVT</th><th>Số lượng</th><th>Đơn giá</th><th>Thành tiền</th><th>Ghi chú</th></tr></thead>
    <tbody>${body}${tot}</tbody></table></div>`;
}

function renderChinh(rows, totals){
  let body = rows.map(r=>`<tr>
    <td class="stt-col">${r.stt??''}</td><td>${r.ten}</td><td>${r.dvt}</td>
    <td>${fmt(r.sl_nha_tre)}</td><td>${fmt(r.sl_mau_giao)}</td><td>${money(r.don_gia)}</td>
    <td>${money(r.tt_nha_tre)}</td><td>${money(r.tt_mau_giao)}</td><td>${fmt(r.tong_sl)}</td><td>${money(r.tong_tt)}</td>
  </tr>`).join('');
  const tot = `<tr class="total"><td colspan="6">Tổng cộng</td>
    <td>${money(totals.tt_nha_tre)}</td><td>${money(totals.tt_mau_giao)}</td><td></td><td>${money(totals.tong_thanh_tien)}</td></tr>`;
  return `<div class="tablewrap"><table>
    <thead><tr><th>#</th><th>Thực phẩm</th><th>ĐVT</th><th>SL Nhà trẻ</th><th>SL Mẫu giáo</th><th>Đơn giá</th><th>TT Nhà trẻ</th><th>TT Mẫu giáo</th><th>Tổng SL</th><th>Tổng thành tiền</th></tr></thead>
    <tbody>${body}${tot}</tbody></table></div>`;
}

function isChanged(){
  const day = DATA[state.tuan][state.cho][state.dayIdx];
  const base = getBaselinePortions(day);
  if(!state.portions) return false;
  return state.portions.an_sang!=base.an_sang || state.portions.nha_tre!=base.nha_tre || state.portions.mau_giao!=base.mau_giao;
}

function onPortionInput(){
  const an_sang = parseFloat(document.getElementById('inp_an_sang').value)||0;
  const nha_tre = parseFloat(document.getElementById('inp_nha_tre').value)||0;
  const mau_giao = parseFloat(document.getElementById('inp_mau_giao').value)||0;
  state.portions = {an_sang, nha_tre, mau_giao};
  renderBody();
}
function resetPortions(){
  state.portions = null;
  renderContent();
}

function renderBody(){
  const rawDay = DATA[state.tuan][state.cho][state.dayIdx];
  const base = getBaselinePortions(rawDay);
  const portions = state.portions || base;
  const day = computeScaled(rawDay, portions);
  const fin = {};
  day.financial_summary.forEach(f=> fin[f.label] = f);
  const soTienAn = day.financial_summary.find(f=>f.label.includes('Số tiền ăn'));
  const tongChi = day.financial_summary.find(f=>f.label.includes('Tổng chi tiền'));
  const chenhLech = day.financial_summary.find(f=>f.label.includes('Chênh lệch'));

  document.getElementById('computed-slot').innerHTML = `
    <div class="card">
      <h2><span class="badge">₫</span>Tổng quan chi tiền chợ</h2>
      <div class="chipgrid">
        <div class="chip"><div class="k">Xuất ăn hiện tại</div><div class="v">${fmt(portions.nha_tre)} NT · ${fmt(portions.mau_giao)} MG</div></div>
        <div class="chip blue"><div class="k">Tiền ăn / cháu (MG)</div><div class="v">${soTienAn? money(soTienAn.mau_giao):'—'}</div></div>
        <div class="chip gold"><div class="k">Tổng chi chợ trong ngày</div><div class="v">${tongChi? money(tongChi.tong):'—'}</div></div>
        <div class="chip green"><div class="k">Chênh lệch cuối ngày</div><div class="v">${chenhLech? money(chenhLech.tong):'—'}</div></div>
      </div>
      <div style="height:10px"></div>
      ${renderFinancial(day.financial_summary)}
    </div>

    <div class="card">
      <h2><span class="badge">2</span>Xuất kho gia vị hằng ngày</h2>
      ${renderGiaVi(day.giavi, day.giavi_total)}
    </div>

    <div class="card">
      <h2><span class="badge">3</span>Chi tiền thực phẩm buổi sáng</h2>
      ${renderSang(day.sang, day.sang_total)}
    </div>

    <div class="card">
      <h2><span class="badge">4</span>Chi tiền thực phẩm ăn chính + xế</h2>
      ${renderChinh(day.chinh_xe, day.chinh_xe_total)}
    </div>
  `;
}

function renderContent(){
  const day = DATA[state.tuan][state.cho][state.dayIdx];
  const base = getBaselinePortions(day);
  state.portions = null;

  const el = document.getElementById('content');
  el.innerHTML = `
    <div class="card">
      <div class="dateline">📅 ${day.day_label}</div>
      <h2><span class="badge">1</span>Thực đơn trong ngày — ${CHO_LABELS[state.cho]}</h2>
      ${renderMenu(day.menu)}
    </div>

    <div class="card">
      <div class="editbox">
        <div class="lead">✏️ Nhập số suất ăn trong ngày${isChanged()?'<span class="changed-tag">Đã sửa</span>':''}</div>
        <div class="editgrid">
          <div class="efield"><label>Ăn sáng</label><input type="number" min="0" step="1" id="inp_an_sang" value="${base.an_sang}"></div>
          <div class="efield"><label>Nhà trẻ</label><input type="number" min="0" step="1" id="inp_nha_tre" value="${base.nha_tre}"></div>
          <div class="efield"><label>Mẫu giáo</label><input type="number" min="0" step="1" id="inp_mau_giao" value="${base.mau_giao}"></div>
        </div>
        <div class="editactions">
          <button class="btn primary" onclick="onPortionInput()">Tính lại</button>
          <button class="btn" onclick="resetPortions()">Khôi phục số gốc</button>
        </div>
        <div class="note">Khi đổi số suất, số lượng và thành tiền của gia vị (mục 2), thực phẩm sáng (mục 3) và thực phẩm chính + xế (mục 4) bên dưới sẽ tự tính lại theo đúng tỷ lệ định mức của thực đơn ${CHO_LABELS[state.cho]} ngày này — món ăn không đổi, chỉ đổi số lượng nguyên liệu.</div>
      </div>
    </div>

    <div id="computed-slot"></div>

    <div class="card">
      <h2><span class="badge">✔</span>Xác nhận</h2>
      <div class="signrow">
        <div><div class="role">Nhà bếp</div><div class="name">&nbsp;</div></div>
        <div><div class="role">Thủ kho</div><div class="name">${day.signers.thu_kho||'—'}</div></div>
        <div><div class="role">Kế toán</div><div class="name">${day.signers.ke_toan||'—'}</div></div>
        <div><div class="role">Hiệu trưởng</div><div class="name">${day.signers.hieu_truong||'—'}</div></div>
      </div>
    </div>
  `;

  ['inp_an_sang','inp_nha_tre','inp_mau_giao'].forEach(id=>{
    document.getElementById(id).addEventListener('keydown', e=>{ if(e.key==='Enter') onPortionInput(); });
  });

  renderBody();
}

function renderAll(){
  document.getElementById('subTitle').textContent = state.tuan + ' · Theo dõi xuất kho theo từng chợ';
  renderTuanRow();
  renderChoRow();
  renderDayRow();
  renderContent();
}
renderAll();
</script>
</body>
</html>
